name: Daily Ranking Shorts Automation

on:
  schedule:
    # 22:00 UTC = 03:30 AM IST (18:00 NY)
    # 03:00 UTC = 08:30 AM IST (23:00 NY)
    - cron: '0 3,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials from Secrets
        env:
          TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 -c "import os; t=os.environ.get('TOKEN_JSON','').strip().lstrip('\ufeff'); open('token.json','w',encoding='utf-8').write(t) if t else None"
          python3 -c "import os; s=os.environ.get('CLIENT_SECRET_JSON','').strip().lstrip('\ufeff'); open('client_secret.json','w',encoding='utf-8').write(s) if s else None"
          if [ -n "$OPENROUTER_KEY" ]; then
            echo "OPENROUTER_API_KEY=$OPENROUTER_KEY" >> .env
            echo "OPENROUTER_API_KEY=$OPENROUTER_KEY" >> $GITHUB_ENV
          fi

      - name: Show yt-dlp version
        run: |
          python -m yt_dlp --version

      # YouTube cookies (2026-10-25 fix): the runner's datacenter IP is
      # treated as a bot, so yt-dlp gets only login-gated formats that
      # 403 on every player client. If the YT_COOKIES_TXT repository
      # secret is set (a youtube.com cookies.txt export, added by the
      # repo owner in Settings > Secrets, never in the repo or logs),
      # write it to cookies.txt for daily.py to pass to yt-dlp.
      # If the secret is absent, this step is a no-op and downloads
      # run exactly as before. cookies.txt is never committed: the
      # state step below only adds state.json.
      - name: Restore YouTube Cookies from Secret
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          python3 -c "import os; t=os.environ.get('YT_COOKIES_TXT','').strip(); open('cookies.txt','w',encoding='utf-8').write(t + '\n') if t else None"
          if [ -s cookies.txt ]; then echo "cookies.txt restored (contents never logged)"; else echo "no YT_COOKIES_TXT secret - running without cookies"; fi

      - name: Run Daily Ranking Shorts Pipeline
        run: |
          python daily.py

      # State must be committed even when the pipeline fails: a failed
      # run still records analytics/comments, and (crucially) a
      # download-failed topic is NOT marked used, so committing it is
      # safe. The workflow still reports as failed from the step above.
      - name: Commit and Push State Updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update publication state [skip ci]" && git push)
