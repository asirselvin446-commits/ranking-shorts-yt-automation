name: Download Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show yt-dlp version
        run: |
          python -m yt_dlp --version

      - name: Install yt-dlp PO Token Provider Plugin
        run: |
          pip install bgutil-ytdlp-pot-provider

      - name: Start BgUtils POT Provider Container
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 5

      - name: Run Download Diagnostic
        run: |
          python test_download.py
