name: Download Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show yt-dlp version
        run: |
          python -m yt_dlp --version

      - name: Restore YouTube Cookies from Secret
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          python3 -c "import os; t=os.environ.get('YT_COOKIES_TXT','').strip(); open('cookies.txt','w',encoding='utf-8').write(t + '\n') if t else None"
          if [ -s cookies.txt ]; then echo "cookies.txt restored (contents never logged)"; else echo "no YT_COOKIES_TXT secret - running without cookies"; fi

      - name: Run Download Diagnostic
        run: |
          python test_download.py
